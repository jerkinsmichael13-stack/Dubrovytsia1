<section class="ds-sec" id="holosy">
    <div class="w18-wrap">
        <div class="ds-sh"><b>§ @@N@@</b><h2>Голоси зі справи</h2><span>свідки, обвинувачені, родини, суд</span></div>
        <figure class="w18-qhero">
            <blockquote>Хотів побачити кров Плятерів, але побачив свою!</blockquote>
            <figcaption><b>Федір Рабешко</b> — Броніславі Старчевській восени 1919 року, коли та пригрозила йому судом за забраних кабанів. Рабешка поранили під Воробином у праву гомілку. Свідчення Старчевської, 29.V.1920, арк. 570 зв.</figcaption>
        </figure>
        <div class="w18-qs">
            <figure class="w18-q"><blockquote>Тоді Олександр Конончук поставив це питання на голосування. Через стрілянину й натовп я не бачив добре, що відбувалося далі, але невдовзі почув залпи.</blockquote><figcaption><b>Аркадій Сибіковський</b><span>жив із матір'ю у Воробині · допит 7.IX.1922, арк. 398</span></figcaption></figure>
            <figure class="w18-q"><blockquote>Графи Плятери разом зі своїми урядовцями вийшли з будівлі, бо селяни пообіцяли, що їх лише заарештують і що буде суд. Однак, попри цю обіцянку, всі вони були замордовані.</blockquote><figcaption><b>Станіслав Буйновський</b><span>вартовий маєтку · допит 30.V.1920, арк. 579 зв.</span></figcaption></figure>
            <figure class="w18-q"><blockquote>Німецькі пости пропустили селян крізь свої ряди, так що за якихось 20 хвилин від початку штурму ми були змушені відступити до двоповерхової кам'яниці.</blockquote><figcaption><b>Віктор Ліпінський</b><span>стражник маєтку, поранений під час облоги · арк. 395 зв.</span></figcaption></figure>
            <figure class="w18-q"><blockquote>Лясковець тоді відповів нам, що ревком вирішить нашу долю пізніше, коли закінчить розправу з Плятерами.</blockquote><figcaption><b>Павло Бердников</b><span>судовий слідчий у Дубровиці 1918 року · допит 20.V.1920, арк. 563 зв.–564</span></figcaption></figure>
            <figure class="w18-q"><blockquote>Ну, вже покінчили з графами і прислугою.</blockquote><figcaption><b>Прокіп Мітлюх</b><span>слова, сказані вдома ввечері 22 листопада; переказав його 16-річний син Андрій · протокол жандармерії 26.IX.1919, арк. 440</span></figcaption></figure>
            <figure class="w18-q"><blockquote>Іди забирай своїх вихованців, лежать уже побиті, як пси.</blockquote><figcaption><b>Єремія Шеремета</b><span>візникові Михайлові Морозу в Мочулищі; слова переказав Мольський · протокол суду 15.III.1923, арк. 118 зв.</span></figcaption></figure>
            <figure class="w18-q"><blockquote>Карабіни видавав нам організатор цієї банди Садовський або ж його помічники Лясковці, які дістали такі від німців.</blockquote><figcaption><b>Єремія Шеремета</b><span>протокол поліції № 411, 20.VIII.1921 · арк. 323</span></figcaption></figure>
            <figure class="w18-q"><blockquote>За кілька днів до нападу до мене приходила мати обвинуваченого Дем'янця і казала, що син казав їй про напад, який невдовзі мав відбутися на маєток Плятерів, і просив її попередити, щоб я виїхав і щоб також попередила про це Плятерів.</blockquote><figcaption><b>Віктор Ліпінський</b><span>на суді 15.III.1923 · арк. 118 зв.</span></figcaption></figure>
            <figure class="w18-q"><blockquote>…у містечку Дубровиця є ще один Федір Рабешко, по батькові Павло, який справді є більшовиком і навіть був поранений під час пограбування маєтку Воробин.</blockquote><figcaption><b>Ксенія Рабешко</b><span>дружина коваля, заарештованого замість однофамільця; п'ятеро малих дітей · прохання 7.VI.1920, арк. 594 <button type="button" class="w18-scanbtn" data-doc="d96"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 1.5h5.5L12.5 4.5v10h-8.5z M9.5 1.5v3h3" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/></svg>скан</button></span></figcaption></figure>
            <figure class="w18-q"><blockquote>…я був тоді хлопцем 17 років, і не лише те, що ніхто б мене не допустив до керівництва повстанням та не став би слухати, але й те, що я взагалі не мав жодного уявлення про вогнепальну зброю.</blockquote><figcaption><b>Степан Лясковець</b><span>скарга з Луцької в'язниці, 1.I.1923 · арк. 40 зв.</span></figcaption></figure>
            <figure class="w18-q"><blockquote>У в'язниці в Ковелі я сиджу вже 18 місяців, і доки я ще буду сидіти? Я залишив господарство своє, дружину і дітей, і все моє руйнується.</blockquote><figcaption><b>Іван Москальчук-Нашора</b><span>прохання, 2.VIII.1922, «+ + + значить Ян Нашора»</span></figcaption></figure>
            <figure class="w18-q"><blockquote>Місцеві селяни вважали нас гетьманцями. Таємно ми дізналися про напад на Воробин, який мав відбутися ввечері; побоюючись, що нас втягнуть в участь у нападі, ми втекли й пішли кожен до свого села.</blockquote><figcaption><b>Голова ґміни Пляшко</b><span>свідок захисту Будкевича · арк. 119 зв.</span></figcaption></figure>
            <figure class="w18-q"><blockquote>Обвинувачення нічим не довело, щоб Дем'янець, тоді шістнадцятирічний хлопець, брав участь у цьому жахливому злочині, за який його засуджено.</blockquote><figcaption><b>Олександр Ростоцький</b><span>адвокат Дем'янця, апеляційна скарга · арк. 175</span></figcaption></figure>
            <figure class="w18-q w18-q--court"><blockquote>…міркування про суспільно-політичний переворот, під час якого було вчинено інкримінований їм злочин, а також та обставина, що більша частина виконавців цього злочину спромоглася уникнути відповідальності, не можуть мати жодного значення для справи.</blockquote><figcaption><b>Апеляційний суд у Любліні</b><span>мотивований вирок, 25.IX.1923 · арк. 227 зв.</span></figcaption></figure>
        </div>
    </div>
